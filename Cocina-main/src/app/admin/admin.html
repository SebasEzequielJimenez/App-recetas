<section>
  <h2>Panel Administrador</h2>

  @if (recetas.length === 0) {
    <p>No hay recetas cargadas.</p>
  } @else {
    @for (r of recetas; track r.id) {
      <div class="card">
        <h3>{{ r.titulo }}</h3>
        <p>Estado actual: {{ r.estado }}</p>
        <button (click)="toggleEstado(r)">
          Cambiar estado
        </button>
      </div>
    } @empty {
      <p>No se encontraron recetas.</p>
    }
  }
</section>
