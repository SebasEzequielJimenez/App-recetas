<section>
  <h2>Iniciar sesión</h2>
  <form (submit)="submit()">
    <label>Usuario</label>
    <input [(ngModel)]="username" name="username" />
    <label>Contraseña</label>
    <input type="password" [(ngModel)]="password" name="password" />
    <button type="submit">Entrar</button>
  </form>
</section>
